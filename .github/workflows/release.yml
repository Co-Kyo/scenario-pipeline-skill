name: Release sp-skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Checkout release ref
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Version gate
        id: version-gate
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=version-mismatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/Co-Kyo/sp-skill/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=release-exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Install and build
        if: steps.version-gate.outputs.should_release == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Assemble Markdown skill release
        if: steps.version-gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          rm -rf release/sp-skill
          mkdir -p release/sp-skill
          cp dist/sp-skill/SKILL.md release/sp-skill/SKILL.md
          cp -R dist/sp-skill/processes release/sp-skill/processes
          cp -R assets/. release/sp-skill/assets/
          cp -R plugins/. release/sp-skill/plugins/
          cp LICENSE release/sp-skill/LICENSE
          cp VERSION_LINEAGE.json release/sp-skill/VERSION_LINEAGE.json
          cd release/sp-skill
          python3 -m zipfile -c "../sp-skill-${RELEASE_TAG}.zip" .

      - name: Update release branch
        if: steps.version-gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 常规迭代更新：release 分支保留 git 历史，每次发布累积一个 commit，
          # 可用 git log/diff 对比版本间产物变化。禁止 --orphan/--force（过渡期已结束）。
          git fetch origin release:refs/remotes/origin/release || true
          rm -rf /tmp/sp-skill-release
          if git rev-parse --verify refs/remotes/origin/release >/dev/null 2>&1; then
            git worktree add -B release /tmp/sp-skill-release origin/release
          else
            git worktree add --orphan /tmp/sp-skill-release release-orphan-tmp
            git -C /tmp/sp-skill-release checkout --orphan release
            git -C /tmp/sp-skill-release rm -rf . || true
          fi
          cd /tmp/sp-skill-release
          # 清空旧产物（保留 .git），再拷入新产物
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          find "$GITHUB_WORKSPACE/release/sp-skill" -mindepth 1 -maxdepth 1 -exec cp -R {} . \;
          cat > README.md <<'EOF'
          # sp-skill release

          This branch contains the generated, importable Markdown version of sp-skill.

          - `SKILL.md` is the skill entry point.
          - `processes/` contains the step Markdown files.
          - The source repository lives on `dev`.
          EOF
          git add .
          if git diff --cached --quiet; then
            echo "release 内容无变化，跳过提交"
          else
            git commit -m "chore: publish sp-skill ${RELEASE_TAG}"
            git push origin release
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/sp-skill-release

      - name: Pack source
        if: steps.version-gate.outputs.should_release == 'true'
        run: |
          git archive --format=zip -o release/source.zip "$RELEASE_TAG"

      - name: Create GitHub Release
        if: steps.version-gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/source.zip
            release/sp-skill-*.zip
          generate_release_notes: true
